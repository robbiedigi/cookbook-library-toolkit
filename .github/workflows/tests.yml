name: Public library and importer tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -c requirements.lock '.[server,test,authoring]' 'numpy>=1.26,<3'
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s tests/v2 -v
