[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cookbook-evidence-library"
version = "0.2.0"
description = "Source-preserving cookbook retrieval for cooking assistants"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["jsonschema==4.26.0", "lxml==6.1.3"]

[project.optional-dependencies]
server = ["mcp==2.2.0", "PyJWT[crypto]==2.15.1", "uvicorn==0.53.0"]
test = ["httpx==0.28.1"]
authoring = ["markdown-it-py==4.2.0", "PyYAML==6.0.3"]
hybrid = ["numpy>=1.26,<3", "fastembed==0.7.4"]
pdf = ["pdfplumber==0.11.9"]

[project.scripts]
cookbook-demo = "cookbook_demo.__main__:main"
cookbook-tools = "cookbook_tools.__main__:main"

[tool.setuptools.packages.find]
include = ["cookbook*", "library_v2*", "scripts*"]

[tool.setuptools.package-data]
cookbook_demo = ["sources.json"]
library_v2 = ["schemas/*.json", "schemas/*.sql"]
